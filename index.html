<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Transactions Dashboard</title>

  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Plaid Link JS SDK -->
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Top Action Bar -->
    <header class="bg-white rounded-lg shadow-sm p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Bank Transactions</h1>
        <p class="text-sm text-gray-500">Live account integration powered by Plaid & Supabase</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Refresh Data Button -->
        <button 
          id="sync-btn"
          onclick="fetchTransactions()"
          class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-md transition flex items-center gap-2 text-sm"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Refresh Data
        </button>

        <!-- Connect Bank Account Button -->
        <button 
          id="connect-bank-btn" 
          onclick="linkRealAccount()"
          class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-md shadow-sm transition flex items-center gap-2 text-sm disabled:opacity-50"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          <span>Connect Bank Account</span>
        </button>
      </div>
    </header>

    <!-- Status Banner -->
    <div id="status-banner" class="hidden p-4 rounded-md text-sm"></div>

    <!-- Transactions Table -->
    <main class="bg-white rounded-lg shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
              <th class="py-3 px-4">Date</th>
              <th class="py-3 px-4">Description</th>
              <th class="py-3 px-4">Category</th>
              <th class="py-3 px-4 text-right">Amount</th>
            </tr>
          </thead>
          <tbody id="transactions-body" class="divide-y divide-gray-200 text-sm">
            <tr>
              <td colspan="4" class="py-8 text-center text-gray-400">Loading transactions...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <script>
    // ------------------------------------------------------------------
    // 1. SUPABASE CONFIGURATION
    // ------------------------------------------------------------------
    const SUPABASE_URL = 'https://gesppdhjctcplnnuqyyu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6lNXBEN54m51FGkYtmXGow_tCF2NWv9';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ------------------------------------------------------------------
    // 2. PLAID LINK FLOW
    // ------------------------------------------------------------------
    async function linkRealAccount() {
      const connectBtn = document.getElementById('connect-bank-btn');
      setLoadingState(connectBtn, true, 'Connecting...');

      try {
        // Step A: Request a link_token from your Edge Function
        const { data: linkData, error: linkError } = await supabaseClient.functions.invoke('create-link-token');

        if (linkError || !linkData?.link_token) {
          throw new Error(linkError?.message || 'Failed to create Plaid link token.');
        }

        // Step B: Open the Plaid Link modal dialog
        const handler = Plaid.create({
          token: linkData.link_token,
          onSuccess: async (public_token, metadata) => {
            showStatus('Exchanging token and syncing initial transactions...', 'info');

            // Step C: Exchange the public_token for a permanent access_token in Edge Function
            const { error: exchangeError } = await supabaseClient.functions.invoke('exchange-public-token', {
              body: { public_token, metadata }
            });

            if (exchangeError) {
              showStatus(`Connection failed: ${exchangeError.message}`, 'error');
            } else {
              showStatus('Bank account connected successfully!', 'success');
              await fetchTransactions();
            }
            setLoadingState(connectBtn, false, 'Connect Bank Account');
          },
          onExit: (err, metadata) => {
            setLoadingState(connectBtn, false, 'Connect Bank Account');
            if (err != null) {
              showStatus(`Plaid Link error: ${err.display_message || err.message}`, 'error');
            }
          },
          onEvent: (eventName, metadata) => {
            console.log('Plaid Event:', eventName, metadata);
          }
        });

        handler.open();

      } catch (err) {
        showStatus(err.message, 'error');
        setLoadingState(connectBtn, false, 'Connect Bank Account');
      }
    }

    // ------------------------------------------------------------------
    // 3. FETCH TRANSACTIONS FROM SUPABASE
    // ------------------------------------------------------------------
    async function fetchTransactions() {
      const tbody = document.getElementById('transactions-body');
      
      try {
        const { data: transactions, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .order('date', { ascending: false });

        if (error) throw error;

        if (!transactions || transactions.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="py-8 text-center text-gray-500">
                No transactions found. Click <strong>Connect Bank Account</strong> above to sync your account.
              </td>
            </tr>`;
          return;
        }

        tbody.innerHTML = transactions.map(tx => {
          const rawAmount = typeof tx.amount === 'number' ? tx.amount : parseFloat(String(tx.amount || 0).replace(/[^0-9.-]/g, '')) || 0;
          
          const formattedAmount = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD'
          }).format(rawAmount);

          const amountColor = rawAmount < 0 ? 'text-emerald-600' : 'text-gray-900';

          return `
            <tr class="hover:bg-gray-50">
              <td class="py-3 px-4 font-mono text-xs text-gray-500">${tx.date || 'N/A'}</td>
              <td class="py-3 px-4 font-medium text-gray-800">${tx.merchant_name || tx.name || tx.description || 'Unknown'}</td>
              <td class="py-3 px-4">
                <span class="inline-block bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full text-xs">
                  ${tx.user_category || tx.category || 'Uncategorized'}
                </span>
              </td>
              <td class="py-3 px-4 text-right font-medium ${amountColor}">
                ${formattedAmount}
              </td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        showStatus(`Failed to fetch transactions: ${err.message}`, 'error');
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-8 text-center text-red-500">Error loading data from Supabase.</td>
          </tr>`;
      }
    }

    // ------------------------------------------------------------------
    // 4. UI HELPER FUNCTIONS
    // ------------------------------------------------------------------
    function setLoadingState(button, isLoading, text) {
      button.disabled = isLoading;
      const span = button.querySelector('span');
      if (span) span.innerText = text;
    }

    function showStatus(message, type) {
      const banner = document.getElementById('status-banner');
      banner.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-emerald-50', 'text-emerald-700', 'bg-blue-50', 'text-blue-700');
      
      if (type === 'error') {
        banner.classList.add('bg-red-50', 'text-red-700');
      } else if (type === 'success') {
        banner.classList.add('bg-emerald-50', 'text-emerald-700');
      } else {
        banner.classList.add('bg-blue-50', 'text-blue-700');
      }

      banner.innerText = message;
    }

    // Initial load on page ready
    document.addEventListener('DOMContentLoaded', fetchTransactions);
  </script>
</body>
</html>
